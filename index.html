<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowTR</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <!-- Open Graph Meta Tags for Social Media Preview -->
    <meta property="og:title" content="ShadowTR">
    <meta property="og:description" content="Experience the ultimate anime adventure on Trimz.tv">
    <meta property="og:image" content="https://raw.githubusercontent.com/watchanimeflix/ShadowTR/main/poster.jpg">
    <meta property="og:url" content="https://trimz.tv/u/sht">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="1000">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ShadowTR">
    <meta name="twitter:description" content="Experience the ultimate anime adventure on Trimz.tv">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/watchanimeflix/ShadowTR/main/poster.jpg">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width:100%; height:100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0400 0%, #3a1200 50%, #0b0300 100%);
            display:flex; justify-content:center; align-items:center; padding:20px; position:relative; overflow:hidden;
        }

        /* Warm animated background */
        body::before{
            content:'';position:fixed;top:0;left:0;width:100%;height:100%;
            background: radial-gradient(circle at 25% 30%, rgba(255,180,80,0.12) 0%, transparent 30%), radial-gradient(circle at 80% 80%, rgba(255,220,120,0.06) 0%, transparent 40%);
            animation: shift 16s ease-in-out infinite; z-index:0; pointer-events:none;
        }
        @keyframes shift{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,22px)}}

        .container{max-width:900px;width:100%;display:flex;gap:40px;align-items:center;justify-content:center;position:relative;z-index:1;flex-wrap:wrap}
        .poster-section{flex:0 1 360px;animation:slideInLeft .8s ease-out}
        .poster-wrapper{position:relative;display:inline-block;width:100%}

        /* SVG poster styles */
        .svg-poster{width:100%;border-radius:16px;overflow:hidden;border:2px solid rgba(255,160,60,0.10);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.18));box-shadow:0 18px 40px rgba(0,0,0,0.6);}
        .svg-poster svg{display:block;width:100%;height:auto}

        /* Parallax layer animations */
        .layer-bg{transform-origin:center;animation:parallaxBg 9s ease-in-out infinite}
        .layer-mid{transform-origin:center;animation:parallaxMid 7s ease-in-out infinite}
        .layer-fg{transform-origin:center;animation:parallaxFg 5.5s ease-in-out infinite}
        @keyframes parallaxBg{0%{transform:translateX(-8px)}50%{transform:translateX(8px)}100%{transform:translateX(-8px)}}
        @keyframes parallaxMid{0%{transform:translateX(0)}50%{transform:translateX(-10px)}100%{transform:translateX(0)}}
        @keyframes parallaxFg{0%{transform:translateX(8px)}50%{transform:translateX(-6px)}100%{transform:translateX(8px)}}

        /* gentle bob */
        .svg-poster{animation:float 6.4s ease-in-out infinite}
        @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}

        /* Eye glow pulse */
        .eye-pupil{fill:#1a1200;}
        .eye-glow{fill:#ffd27f;opacity:0.0;filter:blur(6px);transition:opacity .2s ease}
        .eye-glow.pulse{animation:eyePulse 2s ease-in-out infinite}
        @keyframes eyePulse{0%{opacity:0.18}50%{opacity:0.86}100%{opacity:0.18}}

        /* hair sway via CSS targeting SVG groups */
        .hair{transform-origin:300px 300px;animation:hairSway 4.8s ease-in-out infinite}
        @keyframes hairSway{0%{transform:translateY(0) rotate(-0.5deg)}50%{transform:translateY(-6px) rotate(0.8deg)}100%{transform:translateY(0) rotate(-0.5deg)}}

        /* particle animation */
        .particle{opacity:0.9;animation:particleRise linear infinite}
        @keyframes particleRise{0%{transform:translateY(0);opacity:0}10%{opacity:0.9}90%{opacity:0.2}100%{transform:translateY(-220px);opacity:0}}

        /* Title & CTA warm styles */
        .neon-title{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-weight:800}
        .neon-fill{fill:url(#neonGradient)}
        .neon-glow{filter:drop-shadow(0 0 10px rgba(255,140,0,0.85)) drop-shadow(0 0 26px rgba(255,200,120,0.45))}
        .shimmer{animation:shimmer 3s linear infinite}
        @keyframes shimmer{0%{opacity:0.9}50%{opacity:1}100%{opacity:0.9}}

        /* scan overlay */
        .scanline{opacity:0.04;mix-blend-mode:multiply}

        /* Content section */
        .content-section{flex:1;min-width:280px;animation:slideInRight .8s ease-out}
        h1{color:#ffd27f;font-size:3em;margin-bottom:20px;text-shadow:0 0 16px rgba(255,140,0,0.7),0 0 34px rgba(255,90,15,0.32),2px 2px 4px rgba(0,0,0,0.8);font-weight:800;letter-spacing:2px;text-transform:uppercase;line-height:1.1;animation:fadeInUp .8s .2s both}
        .title-accent{display:inline-block;background:linear-gradient(135deg,#ff7a1a,#ffd27f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .divider{height:3px;width:80px;background:linear-gradient(90deg,#ff7a1a,#ffd27f);margin:20px 0;border-radius:2px;animation:expandWidth .8s .3s both}
        .subtitle{color:#f6e6d0;font-size:1.1em;margin-bottom:18px;line-height:1.5;font-weight:300}
        .features{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
        .feature{color:#f0e7d9;font-size:0.95em}
        .feature::before{content:'▸';color:#ff6a00;margin-right:8px}
        .cta-button{display:inline-block;padding:15px 44px;background:linear-gradient(135deg,#ff7a1a,#ffb24a);color:#000;border-radius:40px;font-weight:800;box-shadow:0 10px 30px rgba(255,120,30,0.24)}

        /* small screens */
        @media (max-width:900px){.container{flex-direction:column;gap:26px}.poster-section{flex:0 1 340px}h1{font-size:2.5em}}
        @media (max-width:600px){.poster-section{flex:0 1 260px}.cta-button{padding:12px 28px}}

        /* utility animations */
        @keyframes slideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes expandWidth{from{width:0;opacity:0}to{width:80px;opacity:1}}
    </style>
</head>
<body>
    <div class="container">
        <!-- Poster Section -->
        <div class="poster-section">
            <div class="poster-wrapper">
                <!-- Inline animated SVG poster: richer anime-style (eyes, hair, particles) -->
                <div class="svg-poster" role="img" aria-label="ShadowTR animated poster">
                    <svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="false">
                        <defs>
                            <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stop-color="#2b0600" />
                                <stop offset="60%" stop-color="#3a1200" />
                                <stop offset="100%" stop-color="#120200" />
                            </linearGradient>
                            <linearGradient id="neonGradient" x1="0" x2="1">
                                <stop offset="0%" stop-color="#ff7a1a" />
                                <stop offset="100%" stop-color="#ffd27f" />
                            </linearGradient>
                            <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="6" result="b" />
                                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>

                        <!-- background -->
                        <g class="layer-bg">
                            <rect x="0" y="0" width="600" height="900" fill="url(#bgGrad)" />
                            <ellipse cx="100" cy="160" rx="240" ry="120" fill="#ff9a00" opacity="0.05" />
                            <ellipse cx="520" cy="740" rx="260" ry="140" fill="#ffd27f" opacity="0.03" />
                        </g>

                        <!-- subtle mid glow -->
                        <g class="layer-mid" style="mix-blend-mode:screen">
                            <rect x="-50" y="200" width="700" height="360" fill="url(#neonGradient)" opacity="0.03" />
                        </g>

                        <!-- particles (animated) -->
                        <g class="layer-mid" opacity="0.9">
                            <circle class="particle" cx="260" cy="520" r="2.8" fill="#ffd27f" style="animation-duration:6s;animation-delay:0.2s" />
                            <circle class="particle" cx="320" cy="600" r="2.2" fill="#ffb86b" style="animation-duration:5s;animation-delay:0.7s" />
                            <circle class="particle" cx="460" cy="420" r="1.8" fill="#ff9a3a" style="animation-duration:7.2s;animation-delay:1s" />
                            <circle class="particle" cx="140" cy="380" r="2.4" fill="#ffd27f" style="animation-duration:5.6s;animation-delay:0.4s" />
                        </g>

                        <!-- foreground character group -->
                        <g class="layer-fg" transform="translate(0,0)">
                            <!-- stylized character body (vector shapes) -->
                            <g transform="translate(120,120)">
                                <!-- cloak/back hair -->
                                <path class="hair" d="M40 20 C10 160, 20 360, 60 460 C110 580, 210 640, 300 620 C380 604, 420 540, 460 430 C500 320, 520 180, 460 100 C410 40, 300 20, 200 30 C140 36,80 20,40 20z" fill="#0b0503" opacity="0.98" />

                                <!-- face plate -->
                                <g transform="translate(120,90)">
                                    <ellipse cx="0" cy="0" rx="68" ry="92" fill="#1b1208" />

                                    <!-- left eye group -->
                                    <g transform="translate(-24,-8)">
                                        <ellipse cx="0" cy="0" rx="14" ry="9" fill="#0f0b06" />
                                        <circle class="eye-glow" cx="0" cy="0" r="12" fill="#ffd27f" opacity="0.3" />
                                        <circle class="eye-pupil" cx="0" cy="0" r="4" />
                                    </g>

                                    <!-- right eye group -->
                                    <g transform="translate(24,-8)">
                                        <ellipse cx="0" cy="0" rx="14" ry="9" fill="#0f0b06" />
                                        <circle class="eye-glow" cx="0" cy="0" r="12" fill="#ffd27f" opacity="0.3" />
                                        <circle class="eye-pupil" cx="0" cy="0" r="4" />
                                    </g>

                                    <!-- small mouth line -->
                                    <path d="M-14 32 Q0 40 14 32" stroke="#2b1a0f" stroke-width="2" fill="none" opacity="0.9" />
                                </g>

                                <!-- chest ornament / light strip -->
                                <rect x="160" y="240" width="80" height="18" rx="8" ry="8" fill="url(#neonGradient)" opacity="0.95" filter="url(#softGlow)" />

                                <!-- hair front strands (animated using small translate) -->
                                <g class="hair" transform="translate(40,20)" style="mix-blend-mode:screen">
                                    <path d="M120 40 C100 58, 86 88, 80 128" stroke="#ff9a3a" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
                                    <path d="M160 36 C150 64, 140 92, 138 128" stroke="#ffd27f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
                                </g>
                            </g>
                        </g>

                        <!-- animated eye glow via CSS class toggling (add pulse class via script) -->
                        <!-- title and CTA -->
                        <g transform="translate(40,680)" class="shimmer">
                            <text x="0" y="0" font-size="72" class="neon-title neon-fill neon-glow" style="letter-spacing:2px;">Shadow</text>
                            <text x="0" y="72" font-size="56" fill="#f6e6d0" style="letter-spacing:3px;">TR</text>
                        </g>

                        <g transform="translate(360,820)">
                            <rect x="0" y="-40" width="220" height="48" rx="24" ry="24" fill="url(#neonGradient)" opacity="0.98" filter="url(#softGlow)" />
                            <text x="110" y="-8" text-anchor="middle" font-size="16" fill="#000" font-weight="700" style="pointer-events:none;">Watch Now</text>
                        </g>

                        <!-- subtle film grain / scan overlay -->
                        <rect x="0" y="0" width="600" height="900" class="scanline" fill="rgba(0,0,0,0.02)" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <h1><span class="title-accent">Shadow</span><br>TR</h1>
            <div class="divider"></div>
            <p class="subtitle">Experience an epic anime adventure. A story of power, mystery, and destiny in a warm mythic future.</p>
            <div class="features">
                <div class="feature">Stunning visuals and world-building</div>
                <div class="feature">Deep character development and compelling storyline</div>
                <div class="feature">High-octane action scenes and emotional depth</div>
            </div>
            <a href="https://trimz.tv/u/sht" class="cta-button" id="watchBtn">Watch Now on Trimz.tv</a>
        </div>
    </div>

    <script>
        // Make eye glow pulse by toggling class on load (works on mobile)
        document.addEventListener('DOMContentLoaded', function(){
            // animate eye glow
            const svg = document.querySelector('.svg-poster svg');
            if(svg){
                const glows = svg.querySelectorAll('.eye-glow');
                glows.forEach(g => g.classList.add('pulse'));
            }

            // small randomized particle animation offsets
            const particles = document.querySelectorAll('.svg-poster .particle');
            particles.forEach((p, i) => {
                const dur = 5 + Math.random()*4; // 5-9s
                const delay = Math.random()*2;
                p.style.animationDuration = dur + 's';
                p.style.animationDelay = delay + 's';
            });

            // tracking -- robust
            const watchBtn = document.getElementById('watchBtn');
            if(watchBtn){
                watchBtn.addEventListener('click', function(){
                    if(typeof gtag === 'function'){
                        gtag('event','click',{'event_category':'engagement','event_label':'watch_now_button','value':1});
                    }
                });
            }
        });

        // existing analytics safety (scroll/time tracking)
        (function(){
            let scrollTracked = {25:false,50:false,75:false,100:false};
            window.addEventListener('scroll', function(){
                const denom = document.documentElement.scrollHeight - window.innerHeight; if(denom<=0) return;
                const scrollPercent = (window.scrollY/denom)*100; Object.keys(scrollTracked).forEach(percent=>{ if(scrollPercent>=percent && !scrollTracked[percent]){ scrollTracked[percent]=true; if(typeof gtag==='function'){ gtag('event','scroll',{ 'event_category':'engagement','event_label':`scroll_${percent}_percent`, 'value':1 }); } } });
            });

            let timeOnPageSec=0; setInterval(function(){ timeOnPageSec+=1; if(typeof gtag==='function' && timeOnPageSec%30===0){ gtag('event','page_time',{ 'event_category':'engagement','event_label':`time_${timeOnPageSec}_seconds`, 'value':timeOnPageSec }); } },1000);
        })();
    </script>
</body>
</html>
