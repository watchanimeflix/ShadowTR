<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowTR</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <!-- Open Graph Meta Tags for Social Media Preview -->
    <meta property="og:title" content="ShadowTR">
    <meta property="og:description" content="Experience the ultimate anime adventure on Trimz.tv">
    <meta property="og:image" content="https://raw.githubusercontent.com/watchanimeflix/ShadowTR/main/poster.jpg">
    <meta property="og:url" content="https://trimz.tv/u/sht">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="1000">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ShadowTR">
    <meta name="twitter:description" content="Experience the ultimate anime adventure on Trimz.tv">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/watchanimeflix/ShadowTR/main/poster.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Amaterasu-inspired warm background */
            background: linear-gradient(135deg, #1a0400 0%, #3a1200 50%, #0b0300 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated Background - warm glows */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,140,0,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,215,0,0.08) 0%, transparent 50%);
            animation: shift 15s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes shift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, 30px); } }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }
        
        /* Poster Section */
        .poster-section { flex: 0 1 320px; animation: slideInLeft 0.8s ease-out; }
        .poster-wrapper { position: relative; display: inline-block; width: 100%; }
        
        /* SVG poster styles */
        .svg-poster { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid rgba(255,160,60,0.10); background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.18)); box-shadow: 0 0 40px rgba(255,106,0,0.10), 0 20px 40px rgba(0,0,0,0.6); }
        .svg-poster svg { display:block; width:100%; height:auto; }

        /* Parallax layers */
        .layer-bg { transform-origin: center; animation: parallaxBg 8s ease-in-out infinite; }
        .layer-mid { transform-origin: center; animation: parallaxMid 6s ease-in-out infinite; }
        .layer-fg { transform-origin: center; animation: parallaxFg 5s ease-in-out infinite; }

        @keyframes parallaxBg { 0%{transform:translateX(-6px) translateY(0)}50%{transform:translateX(6px) translateY(-6px)}100%{transform:translateX(-6px) translateY(0)} }
        @keyframes parallaxMid { 0%{transform:translateX(0) translateY(0)}50%{transform:translateX(-8px) translateY(-4px)}100%{transform:translateX(0) translateY(0)} }
        @keyframes parallaxFg { 0%{transform:translateX(6px) translateY(0)}50%{transform:translateX(-6px) translateY(6px)}100%{transform:translateX(6px) translateY(0)} }

        /* Float */
        .svg-poster { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)} }

        /* Amaterasu neon title */
        .neon-title { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight:700; }
        .neon-fill { fill: url(#neonGradient); }
        .neon-glow { filter: drop-shadow(0 0 8px rgba(255,106,0,0.85)) drop-shadow(0 0 20px rgba(255,200,87,0.45)); }

        /* Shimmer */
        .shimmer { animation: shimmer 3s linear infinite; }
        @keyframes shimmer { 0%{opacity:0.85}50%{opacity:1}100%{opacity:0.85} }

        /* Scanlines */
        .scanline { opacity:0.06; animation: scan 1.2s linear infinite; }
        @keyframes scan { 0%{background-position:0 0}100%{background-position:0 32px} }

        /* Content Section (unchanged layout) */
        .content-section { flex: 1; min-width: 280px; animation: slideInRight 0.8s ease-out; }

        /* Replace cyan/magenta accents with warm Amaterasu palette */
        h1 { color: #ffd27f; font-size: 3em; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,160,60,0.8), 0 0 40px rgba(255,100,30,0.45), 2px 2px 4px rgba(0,0,0,0.8); font-weight: bold; letter-spacing: 2px; text-transform: uppercase; line-height: 1.2; animation: fadeInUp 0.8s ease-out 0.2s both; }
        .title-accent { display: inline-block; background: linear-gradient(135deg, #ff6a00, #ffd27f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .divider { height: 3px; width: 80px; background: linear-gradient(90deg, #ff6a00, #ffd27f); margin: 20px 0; border-radius: 2px; animation: expandWidth 0.8s ease-out 0.3s both; }
        .subtitle { color: #f6e6d0; font-size: 1.2em; margin-bottom: 25px; line-height: 1.6; animation: fadeInUp 0.8s ease-out 0.4s both; font-weight: 300; }
        .features { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; animation: fadeInUp 0.8s ease-out 0.5s both; }
        .feature { color: #f0e7d9; font-size: 0.95em; display: flex; align-items: center; gap: 10px; }
        .feature::before { content: '▸'; color: #ff6a00; font-weight: bold; font-size: 1.2em; }
        .cta-button { display: inline-block; padding: 18px 50px; background: linear-gradient(135deg, #ff6a00 0%, #ff9a00 100%); color: #000; text-decoration: none; border-radius: 50px; font-size: 1.2em; font-weight: bold; transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94); box-shadow: 0 0 30px rgba(255,106,0,0.6), 0 0 60px rgba(255,160,60,0.3), 0 10px 30px rgba(0,0,0,0.4); animation: fadeInUp 0.8s ease-out 0.6s both; border: 2px solid transparent; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .cta-button:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 0 50px rgba(255,106,0,0.85), 0 0 100px rgba(255,160,60,0.5), 0 15px 40px rgba(0,0,0,0.6); background: linear-gradient(135deg, #ff6a00, #ffd27f); }

        /* Animations continued */
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes expandWidth { from { opacity: 0; width: 0; } to { opacity: 1; width: 80px; } }

        /* Responsive adjustments */
        @media (max-width: 900px) { .container { flex-direction: column; gap: 30px; } .poster-section { flex: 0 1 300px; } h1 { font-size: 2.5em; } }
        @media (max-width: 600px) { .container { gap: 20px; } .poster-section { flex: 0 1 250px; } h1 { font-size: 1.8em; letter-spacing: 1px; } .subtitle { font-size: 1em; } .feature { font-size: 0.9em; } .cta-button { padding: 16px 40px; font-size: 1em; } .divider { width: 60px; } }

        /* Loading State */
        .loading { opacity: 0.7; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.7} }
    </style>
</head>
<body>
    <div class="container">
        <!-- Poster Section -->
        <div class="poster-section">
            <div class="poster-wrapper">
                <!-- Inline animated SVG poster (Amaterasu warm palette, parallax float) -->
                <div class="svg-poster" role="img" aria-label="ShadowTR poster">
                    <svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="false">
                        <defs>
                            <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stop-color="#2b0600" />
                                <stop offset="60%" stop-color="#3a1200" />
                                <stop offset="100%" stop-color="#120200" />
                            </linearGradient>
                            <linearGradient id="neonGradient" x1="0" x2="1">
                                <stop offset="0%" stop-color="#ff6a00" />
                                <stop offset="100%" stop-color="#ffd27f" />
                            </linearGradient>
                            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="6" result="coloredBlur" />
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            <pattern id="scan" patternUnits="userSpaceOnUse" width="2" height="8">
                                <rect width="2" height="4" fill="#000" opacity="0.06" />
                            </pattern>
                        </defs>

                        <!-- Background layer -->
                        <g class="layer-bg">
                            <rect x="0" y="0" width="600" height="900" fill="url(#bgGrad)" />
                            <ellipse cx="120" cy="180" rx="220" ry="120" fill="#ff9a00" opacity="0.05" />
                            <ellipse cx="500" cy="760" rx="240" ry="140" fill="#ffd27f" opacity="0.035" />
                        </g>

                        <!-- Mid haze / shapes -->
                        <g class="layer-mid" style="mix-blend-mode:screen">
                            <g opacity="0.85">
                                <rect x="-50" y="200" width="700" height="360" fill="url(#neonGradient)" opacity="0.03" />
                                <circle cx="420" cy="260" r="80" fill="#ff6a00" opacity="0.06" />
                                <circle cx="180" cy="420" r="120" fill="#ffd27f" opacity="0.05" />
                            </g>
                        </g>

                        <!-- Foreground main art silhouette (stylized) -->
                        <g class="layer-fg neon-glow">
                            <!-- stylized silhouette rectangle with gradient stroke -->
                            <rect x="40" y="120" width="520" height="660" rx="12" ry="12" fill="none" stroke="url(#neonGradient)" stroke-opacity="0.12" stroke-width="3" />

                            <!-- simple character-like shape (abstract) -->
                            <g transform="translate(120,160)">
                                <path d="M90 40 C70 20, 40 10, 20 60 C10 90, 30 120, 40 150 C60 200, 90 220, 140 220 C200 220, 220 180, 240 130 C255 95, 220 60, 190 50 C160 40,120 55,90 40z" fill="#0b0503" opacity="0.92" />
                                <path d="M120 80 C130 68, 150 64, 160 90" stroke="#ff9a00" stroke-width="2" fill="none" opacity="0.75"/>
                                <path d="M100 140 C120 160, 160 160, 180 140" stroke="#ffd27f" stroke-width="2" fill="none" opacity="0.65"/>
                            </g>
                        </g>

                        <!-- Title / logo -->
                        <g transform="translate(40,680)" class="shimmer">
                            <text x="0" y="0" font-size="72" class="neon-title neon-fill neon-glow" style="letter-spacing:2px;">Shadow</text>
                            <text x="0" y="72" font-size="56" fill="#f6e6d0" style="letter-spacing:3px;">TR</text>
                        </g>

                        <!-- CTA badge -->
                        <g transform="translate(360,820)">
                            <rect x="0" y="-40" width="220" height="48" rx="24" ry="24" fill="url(#neonGradient)" opacity="0.96" filter="url(#glow)" />
                            <text x="110" y="-8" text-anchor="middle" font-size="16" fill="#000" font-weight="700" style="pointer-events:none;">Watch Now</text>
                        </g>

                        <!-- subtle scan overlay -->
                        <rect x="0" y="0" width="600" height="900" fill="url(#scan)" class="scanline" />
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- Content Section -->
        <div class="content-section">
            <h1><span class="title-accent">Shadow</span><br>TR</h1>
            
            <div class="divider"></div>
            
            <p class="subtitle">
                Experience an epic anime adventure. A story of power, mystery, and destiny in a neon-lit future.
            </p>
            
            <div class="features">
                <div class="feature">Stunning visuals and world-building</div>
                <div class="feature">Deep character development and compelling storyline</div>
                <div class="feature">High-octane action scenes and emotional depth</div>
            </div>
            
            <a href="https://trimz.tv/u/sht" class="cta-button" id="watchBtn">Watch Now on Trimz.tv</a>
        </div>
    </div>
    
    <script>
        // Enhanced Analytics Tracking (robust/failsafe)
        document.addEventListener('DOMContentLoaded', function() {
            // Track button click
            const watchBtn = document.getElementById('watchBtn');
            if (watchBtn) {
                watchBtn.addEventListener('click', function() {
                    if (typeof gtag === 'function') {
                        gtag('event', 'click', {
                            'event_category': 'engagement',
                            'event_label': 'watch_now_button',
                            'value': 1
                        });
                    } else {
                        console.log('gtag not available: watch_now_button');
                    }
                    console.log('Watch Now button clicked - tracked (if gtag present)');
                });
            }
            
            // Track poster interaction
            const poster = document.querySelector('.svg-poster');
            if (poster) {
                poster.addEventListener('click', function() {
                    if (typeof gtag === 'function') {
                        gtag('event', 'click', {
                            'event_category': 'engagement',
                            'event_label': 'poster_clicked',
                            'value': 1
                        });
                    }
                });
                
                poster.addEventListener('mouseover', function() {
                    if (typeof gtag === 'function') {
                        gtag('event', 'engagement', {
                            'event_category': 'interaction',
                            'event_label': 'poster_hover',
                            'value': 1
                        });
                    }
                });
            }
            
            // Track page scroll depth
            let scrollTracked = { 25: false, 50: false, 75: false, 100: false };
            window.addEventListener('scroll', function() {
                const denom = document.documentElement.scrollHeight - window.innerHeight;
                if (denom <= 0) return; // nothing to track on non-scrollable pages
                const scrollPercent = (window.scrollY / denom) * 100;
                Object.keys(scrollTracked).forEach(percent => {
                    if (scrollPercent >= percent && !scrollTracked[percent]) {
                        scrollTracked[percent] = true;
                        if (typeof gtag === 'function') {
                            gtag('event', 'scroll', { 'event_category': 'engagement', 'event_label': `scroll_${percent}_percent`, 'value': 1 });
                        }
                    }
                });
            });
            
            // Track time on page (seconds)
            let timeOnPageSec = 0;
            setInterval(function() {
                timeOnPageSec += 1;
                if (typeof gtag === 'function' && timeOnPageSec % 30 === 0) { // Every 30 seconds
                    gtag('event', 'page_time', { 'event_category': 'engagement', 'event_label': `time_${timeOnPageSec}_seconds`, 'value': timeOnPageSec });
                }
            }, 1000);
            
            // Track referrer source
            const referrer = document.referrer || 'direct';
            if (typeof gtag === 'function') {
                gtag('event', 'page_view', { 'event_category': 'source', 'event_label': referrer, 'referrer': referrer });
            }
            
            // Track device type
            const deviceType = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
            if (typeof gtag === 'function') {
                gtag('event', 'device_type', { 'event_category': 'device', 'event_label': deviceType, 'device_type': deviceType });
            }
        });
    </script>
</body>
</html>
