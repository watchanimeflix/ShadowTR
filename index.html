<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowTR</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <!-- Open Graph Meta Tags for Social Media Preview -->
    <meta property="og:title" content="ShadowTR">
    <meta property="og:description" content="Experience the ultimate anime adventure on Trimz.tv">
    <meta property="og:image" content="https://raw.githubusercontent.com/watchanimeflix/ShadowTR/main/poster2.jpg">
    <meta property="og:url" content="https://trimz.tv/u/sht">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="1000">
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        html,body{width:100%;height:100%}
        body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(180deg,#00040a 0%, #00121a 60%, #00030a 100%); display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}

        /* cyan glow background to match the eyes */
        body::before{content:'';position:fixed;inset:0;background: radial-gradient(circle at 50% 22%, rgba(0,220,255,0.12) 0%, transparent 20%), radial-gradient(circle at 75% 75%, rgba(0,180,255,0.06) 0%, transparent 30%);pointer-events:none;z-index:0}

        .container{max-width:900px;width:100%;display:flex;gap:28px;align-items:center;justify-content:center;position:relative;z-index:1;flex-wrap:wrap}

        /* Featured image above the title */
        .featured-wrap{width:100%;display:flex;justify-content:center;margin-bottom:12px}
        .featured-img{max-width:360px;width:100%;height:auto;border-radius:10px;box-shadow:0 20px 50px rgba(0,150,200,0.12);border:2px solid rgba(0,200,255,0.06);}

        .content-section{flex:1;min-width:280px;animation:slideInRight .8s ease-out; text-align:center}
        h1{color:#bff9ff;font-size:48px;margin-top:6px;margin-bottom:6px;font-weight:900;text-shadow:0 8px 40px rgba(0,200,255,0.08)}
        .title-accent{display:inline-block;background:linear-gradient(135deg,#00f0ff,#80dfff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{color:rgba(200,245,255,0.9);font-size:1.05em;margin-bottom:18px}
        .cta-button{display:inline-block;padding:14px 40px;border-radius:36px;background:linear-gradient(90deg,#00f0ff,#66e5ff);color:#001; font-weight:800;text-decoration:none}

        /* responsive */
        @media (max-width:700px){.featured-img{max-width:260px}.title-accent{font-size:28px}h1{font-size:32px}}

        /* loading overlay kept from previous changes */
        #loadingOverlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.7),rgba(0,0,0,0.85));display:flex;align-items:center;justify-content:center;z-index:9999;color:#00f0ff;flex-direction:column;gap:10px}
        #loadingOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .loader{width:56px;height:56px;border-radius:50%;border:6px solid rgba(0,240,255,0.12);border-top-color:#00f0ff;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay"><div class="loader" aria-hidden="true"></div><div class="loading-text">Loading ShadowTR…</div></div>

    <div class="container">
        <div class="content-section">
            <!-- Insert the user-provided image above the title -->
            <div class="featured-wrap">
                <img src="/poster2.jpg" alt="Featured" class="featured-img" id="featuredImg">
            </div>

            <h1><span class="title-accent">Shadow</span> TR</h1>
            <div class="subtitle">Experience an epic anime adventure — click Watch Now to go to Trimz.</div>
            <a href="https://trimz.tv/u/sht" class="cta-button" id="watchBtn">Watch Now</a>
        </div>
    </div>

    <script>
        // hide overlay on load
        (function(){const overlay=document.getElementById('loadingOverlay');function hide(){overlay.classList.add('hidden')}window.addEventListener('load',hide);setTimeout(hide,2500);})();

        // Ensure only watchBtn routes
        document.addEventListener('click', function(e){const a=e.target.closest && e.target.closest('a'); if(!a) return; const href=a.getAttribute('href')||''; if(href.includes('trimz.tv') && a.id!=='watchBtn'){e.preventDefault();e.stopPropagation();console.log('Blocked extra trimz link');}} , true);
    </script>
</body>
</html>
